name: qcafe checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run tools:env
      - run: npm run verify
      - run: npm run packages:check
