name: Qcafe checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/qcafe
    steps:
      - uses: actions/checkout@v4
        with:
          path: projects/qcafe
      - uses: actions/checkout@v4
        with:
          repository: devxcrew/tools
          path: shared/tools
      - uses: actions/checkout@v4
        with:
          repository: devxcrew/mcp-governance
          path: shared/mcp-governance
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - run: npm install --global npm@12.2.0
      - run: npm ci
        working-directory: shared/tools
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run verify
      - run: npm run packages:check
